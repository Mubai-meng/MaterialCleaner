buildscript {
    ext {
        kotlinVersion = '1.9.21'
        kotlinxCoroutinesVersion = '1.7.3'
        navigationVersion = '2.7.6'

        annotationVersion = '1.7.1'
        coreVersion = '1.12.0'
        flatbuffersVersion = '23.5.26'
        guavaVersion = '32.1.3-android'
        lifecycleVersion = '2.6.2'
        preferenceVersion = '1.2.1'
        // https://developer.android.com/topic/security/data-android-versions
        securityCryptoVersion = '1.1.0-alpha06'
    }
    repositories {

        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
    }
}

plugins {
    id 'com.google.devtools.ksp' version '1.9.21-1.0.16' apply false
}

allprojects {
    repositories {

        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// versionCode 单一真源：优先取当前仓库提交数（与上游一致，随每次提交自动递增）。
// 防御性回退：无 git 的分发场景（tarball 解包、git 不可用、浅拷贝失败）下，
// ['git', ...].execute() 会产出空串或直接抛 IOException，原实现在此处
// Integer.parseInt("") 会抛 NumberFormatException，使整个构建在配置期就失败。
// 回退到基线 1，保证任何环境下都能完成配置；有 git 时语义与上游完全一致。
def FALLBACK_VERSION_CODE = 1
def resolveGitCommitCount = {
    try {
        def text = ['git', 'rev-list', '--count', 'HEAD']
                .execute(null, project.rootDir).text.trim()
        return text.isInteger() ? Integer.parseInt(text) : FALLBACK_VERSION_CODE
    } catch (Throwable ignored) {
        return FALLBACK_VERSION_CODE
    }
}
def gitCommitCount = resolveGitCommitCount()

ext {
    minSdk = 26
    targetSdk = 34
    compileSdk = targetSdk
    buildToolsVersion = '34.0.0'
    // 版本号跟随上游 5.0.0（用户 2026-10-10 决定）。
    // versionCode 不能直接用上游的 `gitCommitCount`：本仓库 `git rev-list --count HEAD`
    // 在本次合并后是 389，**低于**已装机产物的 427 ⇒ 直接采用会让 versionCode 回退，
    // 用户无法覆盖安装。因此保留"手工指定"的做法。
    // 2026-10-22：上游 5.2.0 的四个批次（A 诊断取证 / B 日志三通道 / C 错误流水与拆分 /
    // D 日志统计与通知体系）全部合入，按用户决定统一到 5.5.0 / 550。
    // 2026-10-22：5.5.1 / 551 = 第32批看门狗修复（停滞判定必须有「过滤流确有新行」
    // 的证据，此前单 tag tail 空闲期必被误杀；实测 48 次无证据强杀）。
    // 2026-10-23：5.5.7 / 557 = 第38批 P2 修复。普查侧 `VfsLayerController.buildPidFlag`
    // 此前直接拿 pid 读 /proc/<pid>/mountinfo，无存活校验；进程退出且 pid 被复用后
    // 会读到**新进程**的 mountinfo（空数组）⇒ 误判 NOT_MOUNTED（实测 3 个夸克进程，
    // 同时 UI 显示「已挂载」）。修法：采集 starttime 快照 + 三元判定（已消失 /
    // stat 不可读 / starttime 不一致）后跳过，不进 managed 分母。
    // 上一版 5.5.6 / 556 = 第37批白名单修复。
    // 2026-10-23：5.5.10 / 560 = 第42批两项诊断可见性修复。
    // ① `initialize done in …` 整行在 ColorOS LOG_FLOWCTRL 下连续两批 100% 丢失
    //    ⇒ 分段耗时双写进程内 StartupTiming（orchestrated_status.json 的 startupTiming 段）。
    // ② boot log 归档 `keptFirst=512KB` 在 118 KB/s 洪峰下只覆盖 4.3 秒，起机关键
    //    窗口结构性不可见 ⇒ 改为「E/F 全留 + 项目 tag 全留 + 其余均匀采样」的分级裁剪，
    //    全时间轴可见且关键证据零丢失。
    // 2026-10-23：5.5.11 / 561 = 第43批四项（开机策略空窗 + 三处诊断可见性）。
    // ① 开机策略空窗 7.55 s 的真因是 server 侧 `onStart` 取 hook binder 失败后
    //    **10.16 秒无主动重试**（不是 hook 侧轮询，第43批 §9.2 已更正）
    //    ⇒ `CleanerHooksClient` 加启动短退避 200→500→1000→2000×5（共 11.7 s，成功即停）。
    // ② `HookBridgeRegistrar` 的「Provider 还没注册」由 E 降 W 且不打堆栈
    //    （一次开机 17 行 E，12 行是堆栈）；真故障（ack=false / 认不出的异常 /
    //    重试预算耗尽）仍为 E。
    // ③ 实时值 `recordedPids` 加 `recordedPidsAt`，概览并列两个采样时点 —— 它和
    //    30 秒节流的 `vfsMountedPids` 不是同一时刻，连续两批被误读成矛盾。
    // ④ boot log 裁剪加 `### REPLAY` 段：跨日重放行（logd 从 ramoops 重放旧崩溃）
    //    单列，不再污染 CRITICAL 的时间轴（原先会算出负跨度）与预算。
    // 若要切回上游口径，把下面一行改回 `versionCode = gitCommitCount` 即可。
    versionCode = 561
    versionName = '5.5.11'
    javaVersion = JavaVersion.VERSION_17
    ndkVersion = '26.1.10909125'

    // Hook runtime 打包进 main.jar 时必须随行的模块清单（单一真源）：
    // media-provider-hook 的 implementation 依赖与 app 的 buildXposedMainJar
    // d8 输入均由此展开，遗漏任何一项都会导致 Hook 进程
    // NoClassDefFoundError 整体失效。
    xposedRuntimeModules = [
            ':core:ipc-contract',
            ':core:common',
            ':core:storage-redirect-domain',
            ':core:storage-redirect-databus',
            ':platform:hidden-api',
    ]

    // 各随行模块的标志性类（斜杠路径形式）：buildXposedMainJar 的 CI 门禁
    // 据此断言 DEX 中包含每个模块的锚点类，防止打包清单漂移静默通过。
    xposedRuntimeAnchorClasses = [
        ':core:ipc-contract'            : 'me/gm/cleaner/model/OrchestratedStatus',
        ':core:common'                  : 'me/gm/cleaner/core/common/err/ErrorCodes',
        ':core:storage-redirect-domain' : 'me/gm/cleaner/core/storage/redirect/domain/OrderedRedirectInterpreter',
        ':core:storage-redirect-databus': 'me/gm/cleaner/core/storage/redirect/databus/DataBus',
        ':platform:hidden-api'          : 'api/SystemService',
    ]
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
